<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Trajectory Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/marked.umd.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="workspace">
  <aside class="sidebar" aria-label="Trajectory navigation">
    <h2>Run navigator</h2>
    <nav id="navigator" aria-label="Models and attempts"><p class="muted">Choose a runs folder to browse models and attempts.</p></nav>
  </aside>
  <main>
    <section class="folder-picker">
      <div><strong>Open your runs folder</strong><p>Select a local folder to explore its trajectories. Files stay on your device.</p></div>
      <button id="choose-folder" type="button">Choose runs folder</button>
      <input id="folder-input" type="file" webkitdirectory multiple hidden aria-label="Choose runs folder">
    </section>
    <div class="section-heading"><h2>Trajectories</h2><span id="dataset-label" class="muted"></span></div>
    <div id="status" role="status">Choose your runs folder to get started.</div>
    <div id="models"></div>
  </main>
  </div>
</body>
</html>
